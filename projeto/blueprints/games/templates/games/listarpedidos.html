{% extends "base.html" %}
{% block title %}Meus pedidos | NexusGX{% endblock %}
{% block content %}
<section>
    <h2 id="meus-pedidos">Meus pedidos</h2>
    {% for pedido, jogo in pedidos %}
        <p>{{ jogo.nome }}</p>
    {% else %}
        <p>Você ainda não possui pedidos.</p>
    {% endfor %}
</section>
{% endblock %}
