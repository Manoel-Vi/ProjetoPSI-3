{% extends "base.html" %}
{% block title %}Meus Jogos | NexusGX{% endblock %}
{% block content %}
<section >
    <h2 id="meus-jogos">Meus jogos</h2>
    
    {% for jogo, categorias in jogos.items() %}

        <h2>{{ jogo.nome }}</h2>

        <h4>Categorias:</h4>

        {% for categoria in categorias %}
            <span>{{ categoria.nome }}</span>
        {% endfor %}

    {% endfor %}


</section>
{% endblock %}
